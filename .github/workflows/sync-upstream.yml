name: Sync upstream

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync from upstream
        run: |
          git remote add upstream https://github.com/daodeqing/cpa-plugin-GFlow.git
          git fetch upstream main
          git merge --ff-only upstream/main || { echo "::error::Merge conflict detected. Manual resolution required."; exit 1; }
          git push origin main
