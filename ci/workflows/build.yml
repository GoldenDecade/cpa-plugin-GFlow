name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGIN_ID: gflow

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-24.04, ext: so, target: x86_64-unknown-linux-gnu }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm, ext: so, target: aarch64-unknown-linux-gnu }
          - { goos: darwin, goarch: amd64, runner: macos-15-intel, ext: dylib, target: x86_64-apple-darwin }
          - { goos: darwin, goarch: arm64, runner: macos-15, ext: dylib, target: aarch64-apple-darwin }
          - { goos: windows, goarch: amd64, runner: windows-2025, ext: dll, target: x86_64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Resolve release metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF6NAME}" == v* ]]; then
            VERSION="${GITHUB_REF6NAME#v}"
          else
            VERSION="0.1.0"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "LIB_NAME=${PLUGIN_ID}.${{ matrix.ext }}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_NAME=${PLUGIN_ID}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" >> "${GITHUB_ENV}"
      - name: Build Rust cdylib
        run: |
          set -euo pipefail
          cargo build --release --target ${{ matrix.target }}
          mkdir -p dist
          if [ -f "target/${{ matrix.target }}/release/${LIB_NAME}" ]; then
            cp "target/${{ matrix.target }}/release/${LIB_NAME}" "dist/${LIB_NAME}"
          else
            cp "target/release/${LIB_NAME}" "dist/${LIB_NAME}"
          fi
      - name: Package plugin
        run: |
          python .github/scripts/package.py \
            --library "dist/${LIB_NAME}" \
            --archive "${ARCHIVE_NAME}" \
            --checksum "${ARCHIVE_NAME}.sha256"
      - uses: actions/upload-artifact@4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@5
      - uses: actions/download-artifact@4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sort dist/*.sha256 > dist/checksums.txt
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
